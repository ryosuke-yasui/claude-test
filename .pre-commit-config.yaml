repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff-format
        files: ^backend/
      - id: ruff
        files: ^backend/
        args: [--fix, --exit-non-zero-on-fix]

  - repo: local
    hooks:
      - id: frontend-format
        name: Prettier
        entry: bash -c 'cd frontend && pnpm prettier --write --ignore-unknown .'
        language: system
        files: ^frontend/src/
        pass_filenames: false

      - id: frontend-lint
        name: ESLint
        entry: bash -c 'cd frontend && pnpm lint'
        language: system
        files: ^frontend/src/.*\.(ts|tsx)$
        pass_filenames: false
